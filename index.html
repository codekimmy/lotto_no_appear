<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로또 당첨번호 대시보드</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    margin: 0; padding: 20px; background: #f4f6fa; color: #222; }
  h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
  .subtitle { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }

  .controls { max-width: 1400px; margin: 0 auto 15px; background: #fff;
    padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .controls label { font-weight: bold; font-size: 14px; white-space: nowrap; }
  .controls input[type="number"] {
    width: 90px; padding: 7px 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px;
  }
  .controls button { padding: 9px 16px; background: #3498db; color: #fff; border: none;
    border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
  .controls button:hover { background: #2980b9; }
  .controls button.green { background: #27ae60; } .controls button.green:hover { background: #219150; }
  .controls button.gray { background: #7f8c8d; } .controls button.gray:hover { background: #6c7a7b; }

  .status { max-width: 1400px; margin: 0 auto 15px; padding: 10px 15px;
    border-radius: 8px; font-size: 13px; }
  .status.info { background: #eaf4fd; color: #21618c; border-left: 4px solid #3498db; }
  .status.ok { background: #eafaf1; color: #1e8449; border-left: 4px solid #27ae60; }
  .status.err { background: #fdedec; color: #a93226; border-left: 4px solid #e74c3c; }

  .board { max-width: 1400px; margin: 0 auto; background: #fff;
    border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 15px 20px; }

  .heat-wrap { max-height: 75vh; overflow: auto; border: 1px solid #eee; border-radius: 6px; }
  table.heat { border-collapse: separate; border-spacing: 0; width: 100%;
    min-width: 1000px; table-layout: fixed; }
  table.heat th, table.heat td {
    border-right: 1px solid #f0f0f0; border-bottom: 1px solid #f0f0f0;
    text-align: center; padding: 0; height: 32px; font-size: 13px; }

  /* 헤더 고정 */
  table.heat thead th { position: sticky; top: 0; z-index: 3;
    background: #f7f9fc; font-weight: bold;
    border-bottom: 2px solid #e0e0e0; }
  table.heat th.rowhead {
    width: 100px; background: #f7f9fc; font-weight: bold; color: #2c3e50;
    position: sticky; left: 0; z-index: 2;
    border-right: 2px solid #e0e0e0; }
  table.heat thead th.rowhead { z-index: 4; }

  /* 당첨번호가 들어가는 셀 */
  table.heat td.cell {
    font-weight: bold; color: #333; font-size: 13px; line-height: 32px; }

  /* 당첨번호 셀 = 빨간 배경 + 흰 글자 */
  table.heat td.hit {
    background: #dc2626; color: #fff; font-weight: 900; }

  .note { max-width: 1400px; margin: 20px auto; padding: 12px;
    background: #fffbe6; border-left: 4px solid #f1c40f;
    font-size: 13px; color: #555; border-radius: 5px; }
</style>
</head>
<body>

<h1>🎯 로또 당첨번호 표</h1>
<div class="subtitle">범위를 지정하면 회차별 당첨번호를 1~45 위치에 표시 · 범위 내 등장번호는 헤더 빨강</div>

<div class="controls">
  <label>시작 회차:</label>
  <input type="number" id="startDraw" placeholder="예: 1236">
  <label>종료 회차:</label>
  <input type="number" id="endDraw" placeholder="예: 1240">
  <button class="gray" onclick="applyRange()">범위 조회</button>
  <button onclick="runAnalysis()">▶ 분석 실행</button>
  <button class="green" onclick="loadFromSheet(true)">↻ 새로고침</button>
</div>

<div class="status info" id="status">[▶ 분석 실행] 버튼을 누르면 시트에서 데이터를 불러옵니다.</div>

<div class="board" id="board" style="display:none;">
  <div class="heat-wrap" id="heatWrap"></div>
</div>

<div class="note">
  ※ 페이지는 <b>[▶ 분석 실행] 버튼을 눌러야</b> 시작됩니다 (자동 실행 안 함).<br>
  ※ <b>시작/종료 회차</b>를 입력하고 [범위 조회] → 그 범위의 회차들이 표시됩니다.<br>
  ※ 각 행 = 한 회차. 당첨번호 6개가 1~45 위치에 표시됩니다.<br>
  ※ 상단 헤더(1~45)에서 <b style="color:#dc2626;">범위 안에서 한 번이라도 나온 번호</b>는 빨강, 나머지는 검정.
</div>

<script>
/* ============================================================
   ★ Google Sheets CSV URL (고정)
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQtTpRkYQkAJVRPyEW0spfs4bJzQEAUbNjw4TFfb7kxWH8Ks2F7ctBnYC-1YeJf_uOnnmsFaxsaRifA/pub?output=csv";

const PROXIES = [
  url => url,
  url => "https://corsproxy.io/?" + encodeURIComponent(url),
  url => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
  url => "https://thingproxy.freeboard.io/fetch/" + url
];
/* ============================================================ */

let lottoData = [];
let loaded = false;

function setStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = msg;
}

async function fetchWithFallback(url) {
  let lastErr = null;
  for (let i = 0; i < PROXIES.length; i++) {
    try {
      const res = await fetch(PROXIES[i](url), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if (text.trim().startsWith('<')) throw new Error('HTML 반환');
      if (!text.includes(',')) throw new Error('CSV 아님');
      return text;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('모든 방법 실패');
}

async function loadFromSheet(forceReload) {
  if (!forceReload && loaded) return true;
  setStatus('info', 'Google Sheets에서 데이터를 불러오는 중...');
  try {
    const text = await fetchWithFallback(SHEET_CSV_URL);
    parseCSV(text);
    if (lottoData.length === 0) throw new Error('파싱 실패');
    loaded = true;

    const draws = lottoData.map(d => d.draw);
    const minD = Math.min(...draws);
    const maxD = Math.max(...draws);

    const startEl = document.getElementById('startDraw');
    const endEl = document.getElementById('endDraw');
    if (!startEl.value) startEl.value = Math.max(minD, maxD - 4);
    if (!endEl.value) endEl.value = maxD;
    startEl.placeholder = `예: ${minD}`;
    endEl.placeholder = `예: ${maxD}`;

    setStatus('ok', `✅ ${lottoData.length}개 회차 로드 완료 (${minD} ~ ${maxD}회)`);

    applyRange();
    return true;
  } catch (e) {
    setStatus('err', '❌ 불러오기 실패: ' + e.message);
    return false;
  }
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  lottoData = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',').map(s => s.replace(/^"|"$/g, '').trim());
    if (cols.length < 8) continue;
    const draw = parseInt(cols[0], 10);
    if (isNaN(draw)) continue;
    const nums = [cols[2],cols[3],cols[4],cols[5],cols[6],cols[7]]
      .map(s => parseInt(s, 10))
      .filter(n => !isNaN(n) && n >= 1 && n <= 45);
    if (nums.length !== 6) continue;
    lottoData.push({ draw: draw, date: cols[1], nums: nums });
  }
  lottoData.sort((a, b) => a.draw - b.draw);
}

function applyRange() {
  if (lottoData.length === 0) {
    setStatus('err', '먼저 [▶ 분석 실행]으로 데이터를 불러오세요.');
    return;
  }

  const startVal = parseInt(document.getElementById('startDraw').value);
  const endVal = parseInt(document.getElementById('endDraw').value);

  const draws = lottoData.map(d => d.draw);
  const minD = Math.min(...draws);
  const maxD = Math.max(...draws);

  let startDraw = isNaN(startVal) ? minD : startVal;
  let endDraw = isNaN(endVal) ? maxD : endVal;

  if (startDraw < minD) startDraw = minD;
  if (endDraw > maxD) endDraw = maxD;
  if (startDraw > endDraw) [startDraw, endDraw] = [endDraw, startDraw];

  document.getElementById('startDraw').value = startDraw;
  document.getElementById('endDraw').value = endDraw;

  setStatus('ok', `범위: ${startDraw} ~ ${endDraw}회 (${endDraw - startDraw + 1}개 회차)`);
  renderTable(startDraw, endDraw);
}

async function runAnalysis() {
  if (!loaded) {
    const ok = await loadFromSheet(true);
    if (!ok) return;
  } else {
    applyRange();
  }
}

function renderTable(startDraw, endDraw) {
  // 범위 안 회차들 (최신 → 과거)
  const items = [...lottoData]
    .filter(d => d.draw >= startDraw && d.draw <= endDraw)
    .sort((a, b) => b.draw - a.draw);

  if (items.length === 0) {
    setStatus('err', `범위(${startDraw}~${endDraw})에 데이터가 없습니다.`);
    document.getElementById('board').style.display = 'none';
    return;
  }

  // 범위 안에서 나온 번호 집합
  const appearedSet = new Set();
  items.forEach(d => d.nums.forEach(n => appearedSet.add(n)));

  const nums = Array.from({length: 45}, (_, i) => i + 1);

  let html = '<table class="heat">';
  html += '<thead><tr><th class="rowhead">회차</th>';
  nums.forEach(n => {
    const style = appearedSet.has(n)
      ? 'color:#dc2626;font-weight:900;'
      : 'color:#2c3e50;';
    html += `<th class="colhead" style="${style}">${n}</th>`;
  });
  html += '</tr></thead><tbody>';

  items.forEach(item => {
    const winSet = new Set(item.nums);
    html += `<tr><th class="rowhead">${item.draw}회</th>`;
    nums.forEach(n => {
      if (winSet.has(n)) {
        html += `<td class="cell hit">${n}</td>`;
      } else {
        html += `<td class="cell"></td>`;
      }
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('heatWrap').innerHTML = html;
  document.getElementById('board').style.display = 'block';
}

window.addEventListener('DOMContentLoaded', () => {
  setStatus('info', '[▶ 분석 실행] 버튼을 누르면 시트에서 데이터를 불러옵니다.');
});
</script>
</body>
</html>
